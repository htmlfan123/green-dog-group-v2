<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Green Dog Group - A modern, fast, and privacy-focused search engine">
  <meta name="theme-color" content="#000000">
  <title>Green Dog Group - Search Freely</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #000;
      color: #fff;
    }

    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    header {
      margin-bottom: 40px;
    }

    .logo {
      max-width: 120px;
      height: auto;
      margin-bottom: 20px;
      animation: fadeIn 0.8s ease-in;
    }

    .title {
      font-size: clamp(1.5rem, 5vw, 3.5rem);
      font-weight: 700;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #a020f0, #ff00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      animation: slideDown 0.8s ease-out;
    }

    .typewrite {
      font-size: clamp(1rem, 3vw, 1.5rem);
      color: #ff00ff;
      min-height: 1.5em;
      display: inline-block;
      margin-top: 10px;
      animation: fadeIn 1.2s ease-in;
    }

    .search-container {
      width: 100%;
      max-width: 600px;
      margin: 30px 0;
      animation: slideUp 0.8s ease-out 0.2s both;
    }

    #search-form {
      display: flex;
      gap: 10px;
    }

    #search-input {
      flex: 1;
      padding: 14px 20px;
      font-size: 16px;
      border: 2px solid rgba(255, 0, 255, 0.3);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    #search-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    #search-input:focus {
      outline: none;
      border-color: #ff00ff;
      background: rgba(0, 0, 0, 0.7);
      box-shadow: 0 0 15px rgba(255, 0, 255, 0.2);
    }

    .search-btn {
      padding: 14px 30px;
      background: linear-gradient(135deg, #a020f0, #ff00ff);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 16px;
    }

    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255, 0, 255, 0.3);
    }

    .search-btn:active {
      transform: translateY(0);
    }

    .info-section {
      margin-top: 40px;
      max-width: 600px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 0, 255, 0.2);
      border-radius: 8px;
      backdrop-filter: blur(10px);
      animation: slideUp 0.8s ease-out 0.4s both;
    }

    .error-display {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid rgba(255, 0, 0, 0.3);
      border-radius: 6px;
      display: none;
      max-height: 200px;
      overflow-y: auto;
    }

    .error-display.show {
      display: block;
    }

    .error-display p {
      color: #ff6b6b;
      margin-bottom: 10px;
    }

    .error-display code {
      display: block;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 12px;
      overflow-x: auto;
      color: #ff00ff;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 30px;
      font-size: 14px;
    }

    .feature-item {
      padding: 10px;
      background: rgba(160, 32, 240, 0.1);
      border-left: 2px solid #a020f0;
      border-radius: 4px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }

      header {
        margin-bottom: 30px;
      }

      #search-form {
        flex-direction: column;
      }

      .search-btn {
        width: 100%;
      }

      .features {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .title {
        font-size: 1.5rem;
      }

      .typewrite {
        font-size: 1rem;
      }

      .search-container {
        margin: 20px 0;
      }

      .features {
        grid-template-columns: 1fr;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>

  <div class="container">
    <header>
      <img src="logo.gif" alt="Green Dog Group Logo" class="logo">
      <h1 class="title">Green Dog Group</h1>
      <div class="typewrite" data-type='["Fast", "Private", "Clean", "Unrestricted", "Modern"]' data-period="2000"></div>
    </header>

    <div class="search-container">
      <form id="search-form">
        <input
          type="text"
          id="search-input"
          placeholder="Search the Web Freely..."
          autocomplete="off"
          aria-label="Search input"
        >
        <button type="submit" class="search-btn">Search</button>
      </form>
    </div>

    <div class="info-section">
      <div class="features">
        <div class="feature-item">🚀 Fast</div>
        <div class="feature-item">🔒 Private</div>
        <div class="feature-item">✨ Clean</div>
        <div class="feature-item">⚡ Modern</div>
      </div>
      <div id="error-display" class="error-display">
        <p id="error-message"></p>
        <code id="error-code"></code>
      </div>
    </div>
  </div>

  <!-- Particles.js Library -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

  <!-- Main Application Scripts -->
  <script src="js/particles-config.js"></script>
  <script src="js/typewriter.js"></script>
  <script src="js/app.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {
        console.log('Service Worker not available');
      });
    }
  </script>
</body>
</html>
